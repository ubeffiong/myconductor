[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myconductor"
version = "0.1.0"
description = "An orchestration-and-reasoning layer for tuberculosis antimicrobial resistance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["tuberculosis", "amr", "bioinformatics", "drug-resistance", "orchestration"]
dependencies = []

[project.optional-dependencies]
# Real-model backends plug in here; the core runs with none of them.
ml = ["xgboost", "scikit-learn", "shap", "numpy"]
docking = ["vina"]
dev = ["pytest"]

[project.scripts]
myconductor = "myconductor.cli:main"

[tool.setuptools.packages.find]
include = ["myconductor*"]

[tool.setuptools.package-data]
myconductor = ["catalogue/*.json", "data/*"]
