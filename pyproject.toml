[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myconductor"
version = "0.2.0"
description = "An evidence-orchestration layer for antimicrobial-resistance genomics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["tuberculosis", "amr", "bioinformatics", "drug-resistance", "orchestration"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
# Reading the WHO catalogue's published .xlsx. A CSV/TSV export needs nothing.
catalogue = ["openpyxl>=3.1"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ubeffiong/myconductor"
Repository = "https://github.com/ubeffiong/myconductor"

[project.scripts]
myconductor = "myconductor.cli:main"

[tool.setuptools.packages.find]
include = ["myconductor*"]

[tool.setuptools.package-data]
myconductor = ["catalogue/*.json", "data/*"]
